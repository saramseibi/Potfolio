name: CI Security & Quality Checks

run-name: "${{ github.workflow }} - ${{ inputs.scan_id }}"

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: Scan ID assigned by the DevSecOps backend
        required: true
        type: string
      trigger:
        description: What triggered this scan (pr, push, manual, schedule)
        required: false
        type: string
      commit_sha:
        description: Commit SHA being scanned
        required: false
        type: string
      pr_number:
        description: Pull request number, if applicable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: security-${{ inputs.pr_number || inputs.scan_id }}
  cancel-in-progress: true


jobs:

  composer-audit:
    name: Composer CVE Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      check_result: ${{ steps.audit.outputs.exit_code == '0' && 'success' || 'failure' }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Run Composer audit
        id: audit
        shell: bash
        run: |
          if [[ ! -f composer.json ]]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "reason=composer.json was not found" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f composer.lock ]]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "reason=composer.lock was not found" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "applicable=true" >> "$GITHUB_OUTPUT"

          set +e
          composer audit \
            --locked \
            --no-interaction \
            --format=json \
            > composer-audit.json \
            2> composer-audit.stderr.txt
          audit_exit_code=$?
          set -e

          echo "exit_code=$audit_exit_code" >> "$GITHUB_OUTPUT"

      - name: Build scan-result.json
        if: always()
        env:
          SCAN_ID: ${{ inputs.scan_id || github.run_id }}
          APPLICABLE: ${{ steps.audit.outputs.applicable }}
          SKIP_REASON: ${{ steps.audit.outputs.reason }}
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw_path = Path("composer-audit.json")
          stderr_path = Path("composer-audit.stderr.txt")

          summary = {
              "total": 0,
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
              "unknown": 0,
              "affected_packages": 0,
              "abandoned_packages": 0,
          }
          findings = []
          error = None

          if os.environ.get("APPLICABLE") != "true":
              status = "skipped"
              error = os.environ.get("SKIP_REASON") or "Composer audit is not applicable"
              raw = {}
          else:
              try:
                  raw = json.loads(raw_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raw = {}
                  status = "failed"
                  error = f"Could not parse Composer audit JSON: {exc}"
              else:
                  status = "completed"
                  advisories = raw.get("advisories", {})
                  abandoned = raw.get("abandoned", {})

                  if not isinstance(advisories, dict):
                      advisories = {}
                  if not isinstance(abandoned, dict):
                      abandoned = {}

                  summary["affected_packages"] = len(advisories)
                  summary["abandoned_packages"] = len(abandoned)

                  for package_name, package_advisories in advisories.items():
                      if not isinstance(package_advisories, list):
                          continue

                      for advisory in package_advisories:
                          if not isinstance(advisory, dict):
                              continue

                          severity = str(advisory.get("severity") or "unknown").lower()
                          if severity == "moderate":
                              severity = "medium"
                          if severity not in {"critical", "high", "medium", "low"}:
                              severity = "unknown"

                          summary[severity] += 1
                          summary["total"] += 1

                          findings.append({
                              "package": package_name,
                              "severity": severity,
                              "advisory_id": advisory.get("advisoryId"),
                              "cve": advisory.get("cve"),
                              "title": advisory.get("title"),
                              "affected_versions": advisory.get("affectedVersions"),
                              "link": advisory.get("link"),
                              "reported_at": advisory.get("reportedAt"),
                          })

          stderr = None
          if stderr_path.exists():
              value = stderr_path.read_text(encoding="utf-8", errors="replace").strip()
              stderr = value or None

          result = {
              "schema_version": 1,
              "scan_id": os.environ["SCAN_ID"],
              "scanner": "composer-audit",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "status": status,
              "tool_exit_code": int(os.environ.get("AUDIT_EXIT_CODE") or 0),
              "summary": summary,
              "findings": findings,
              "error": error,
              "stderr": stderr,
          }

          Path("scan-result.json").write_text(
              json.dumps(result, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload Composer detailed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-detail-composer
          path: |
            scan-result.json
            composer-audit.json
            composer-audit.stderr.txt
          if-no-files-found: warn
          retention-days: 30




  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      check_result: ${{ steps.semgrep.outputs.exit_code == '0' && 'success' || 'failure' }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        id: semgrep
        shell: bash
        run: |
          set +e
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --json \
            --output=semgrep-raw.json \
            --exclude vendor \
            --exclude node_modules \
            --exclude storage \
            --exclude bootstrap/cache \
            2> semgrep.stderr.txt
          semgrep_exit_code=$?
          set -e

          echo "exit_code=$semgrep_exit_code" >> "$GITHUB_OUTPUT"

      - name: Build scan-result.json
        if: always()
        env:
          SCAN_ID: ${{ inputs.scan_id || github.run_id }}
          SEMGREP_EXIT_CODE: ${{ steps.semgrep.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw_path = Path("semgrep-raw.json")
          stderr_path = Path("semgrep.stderr.txt")

          severity_map = {"error": "high", "warning": "medium", "info": "low"}

          summary = {"total": 0, "high": 0, "medium": 0, "low": 0}
          findings = []
          error = None

          try:
              raw = json.loads(raw_path.read_text(encoding="utf-8"))
          except Exception as exc:
              raw = {}
              status = "failed"
              error = f"Could not parse Semgrep JSON: {exc}"
          else:
              status = "completed"
              for result in raw.get("results", []):
                  if not isinstance(result, dict):
                      continue

                  extra = result.get("extra") or {}
                  metadata = extra.get("metadata") or {}
                  severity = severity_map.get(str(extra.get("severity") or "").lower(), "low")
                  cwe = metadata.get("cwe")
                  if isinstance(cwe, list):
                      cwe = cwe[0] if cwe else None

                  summary[severity] += 1
                  summary["total"] += 1

                  findings.append({
                      "rule_id": result.get("check_id"),
                      "title": (extra.get("message") or "").splitlines()[0][:200] if extra.get("message") else result.get("check_id"),
                      "message": extra.get("message"),
                      "severity": extra.get("severity"),
                      "file_path": result.get("path"),
                      "line_number": (result.get("start") or {}).get("line"),
                      "cwe": cwe,
                      "link": metadata.get("shortlink"),
                  })

          stderr = None
          if stderr_path.exists():
              value = stderr_path.read_text(encoding="utf-8", errors="replace").strip()
              stderr = value or None

          result = {
              "schema_version": 1,
              "scan_id": os.environ["SCAN_ID"],
              "scanner": "semgrep",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "status": status,
              "tool_exit_code": int(os.environ.get("SEMGREP_EXIT_CODE") or 0),
              "summary": summary,
              "findings": findings,
              "error": error,
              "stderr": stderr,
          }

          Path("scan-result.json").write_text(
              json.dumps(result, indent=2),
              encoding="utf-8",
          )

          lines = [f"Semgrep found {summary['total']} finding(s) "
                   f"({summary['high']} high, {summary['medium']} medium, {summary['low']} low)."]
          for f in findings:
              lines.append(f"\n[{f['severity']}] {f['rule_id']}")
              lines.append(f"  {f['file_path']}:{f['line_number']}")
              if f.get("message"):
                  lines.append(f"  {f['message'].splitlines()[0]}")
          Path("semgrep-results.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Add Semgrep result to summary
        if: always()
        run: |
          echo "## Semgrep Security Scan" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.semgrep.outputs.exit_code }}" = "0" ]; then
            echo " Semgrep security scan passed" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo " Semgrep detected security findings" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f semgrep-results.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -100 semgrep-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Semgrep detailed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-detail-semgrep
          path: |
            scan-result.json
            semgrep-results.txt
            semgrep-raw.json
          if-no-files-found: warn
          retention-days: 30




  ci-report:
    name: Create CI JSON Report
    if: ${{ always() }}

    needs:
      - composer-audit
      - semgrep

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Download detailed test results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: ci-detail-*
          path: detailed-results
          merge-multiple: true

      - name: Ensure every result file exists
        shell: bash
        run: |
          mkdir -p detailed-results

          ensure_report() {
            file="$1"
            tool="$2"

            if [ ! -f "$file" ]; then
              echo "No detailed output was generated by $tool." > "$file"
              echo "The job may have failed before the scan command started." >> "$file"
            fi
          }

          ensure_report \
            detailed-results/composer-audit.json \
            "Composer Audit"

          ensure_report \
            detailed-results/semgrep-results.txt \
            "Semgrep"

      - name: Create JSON report
        env:
          COMPOSER_JOB_RESULT: ${{ needs.composer-audit.result }}
          COMPOSER_CHECK_RESULT: ${{ needs.composer-audit.outputs.check_result }}

          SEMGREP_JOB_RESULT: ${{ needs.semgrep.result }}
          SEMGREP_CHECK_RESULT: ${{ needs.semgrep.outputs.check_result }}

          SCAN_ID: ${{ inputs.scan_id || '' }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          PR_HEAD_SHA: ${{ inputs.commit_sha || '' }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
          SERVER_URL: ${{ github.server_url }}

        run: |
          CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          jq -n \
            --arg schema_version "1" \
            --arg scan_id "$SCAN_ID" \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF_NAME" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg created_at "$CREATED_AT" \
            --arg composer_job "$COMPOSER_JOB_RESULT" \
            --arg composer_check "$COMPOSER_CHECK_RESULT" \
            --arg semgrep_job "$SEMGREP_JOB_RESULT" \
            --arg semgrep_check "$SEMGREP_CHECK_RESULT" \
            --rawfile composer_details \
              detailed-results/composer-audit.json \
            --rawfile semgrep_details \
              detailed-results/semgrep-results.txt \
            '
            def optional_status($value):
              if $value == "" then null else $value end;

            def optional_number($value):
              if $value == "" then null else ($value | tonumber) end;

            {
              schema_version: ($schema_version | tonumber),
              scan_id: optional_status($scan_id),
              repository: $repository,
              workflow: $workflow,
              run_id: ($run_id | tonumber),
              run_attempt: ($run_attempt | tonumber),
              run_url: $run_url,
              event: $event,
              ref: $ref,
              commit_sha: $commit_sha,
              pull_request: {
                number: optional_number($pr_number),
                head_sha: (
                  if $pr_head_sha == "" then null else $pr_head_sha end
                )
              },
              created_at: $created_at,
              policy: {
                explicit_merge_gate_enabled: false,
                slack_notification_enabled: false,
                zap_in_this_workflow: false
              },
              jobs: {
                composer_audit: {
                  job_result: $composer_job,
                  check_result: optional_status($composer_check),
                  details: $composer_details
                },
                semgrep: {
                  job_result: $semgrep_job,
                  check_result: optional_status($semgrep_check),
                  details: $semgrep_details
                }
              }
            }
            ' > ci-security-report.json

      - name: Validate JSON report
        run: jq empty ci-security-report.json

      - name: Upload complete CI security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-report
          path: |
            ci-security-report.json
            detailed-results/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
