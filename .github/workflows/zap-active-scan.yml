name: OWASP ZAP Active Scan

on:
  workflow_dispatch:
    inputs:
      scan_id:    { required: false }
      trigger:    { required: false }
      commit_sha: { required: false }

permissions:
  contents: read

concurrency:
  group: zap-active-staging
  cancel-in-progress: false

jobs:
  zap_scan:
    name: ZAP Web Active Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Run ZAP full scan
        id: zap_scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://testphp.vulnweb.com
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          artifact_name: ci-security-report
          allow_issue_writing: false
          fail_action: false
          cmd_options: -a
